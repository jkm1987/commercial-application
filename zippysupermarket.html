<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zippy Supermarket - Multi-Terminal POS & Inventory System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone compiler for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            touch-action: pan-y; 
            -webkit-text-size-adjust: 100%;
        }

        .thermal-receipt {
            font-family: 'Courier New', Courier, monospace;
            color: #000;
        }
        .thermal-receipt .divider {
            border-bottom: 1px dashed #000;
            margin: 8px 0;
        }
        .thermal-receipt table {
            width: 100%;
        }
        .thermal-receipt th, .thermal-receipt td {
            padding: 2px 0;
        }

        .receipt-copy-block {
            page-break-after: always;
            break-after: page;
        }

        @media print {
            @page {
                margin: 0; 
            }
            body, html {
                margin: 0;
                padding: 0;
                background-color: white;
            }
            body * { 
                visibility: hidden; 
            }
            
            #printable-receipt-area, #printable-receipt-area * { 
                visibility: visible; 
            }
            #printable-receipt-area {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 80mm !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 5px !important;
                background: white !important;
                box-shadow: none !important;
                border: none !important;
            }
            .no-print { 
                display: none !important; 
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen relative">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const categoriesData = {
          "Dairy & Bakery": { 
              adjectives: ["Organic", "Farm Fresh", "Greek", "Salted", "Unsalted", "Premium", "Low Fat", "Whole", "Artisan", "Rich", "Aged", "Classic"], 
              nouns: ["Milk", "Brown Bread", "Butter", "Paneer", "Cheese", "Yogurt", "Croissant", "Bagel", "Cream", "Whey", "Sourdough", "Muffin"], 
              units: ["1 L", "400 g", "500 g", "200 g"], 
              basePrice: 50 
          },
          "Fruits & Vegetables": { 
              adjectives: ["Fresh", "Ripe", "Juicy", "Crisp", "Local", "Exotic", "Organic", "Tender", "Green", "Sweet", "Leafy", "Root"], 
              nouns: ["Bananas", "Tomatoes", "Onions", "Potatoes", "Apples", "Carrots", "Spinach", "Grapes", "Mangoes", "Avocados", "Broccoli", "Cabbage"], 
              units: ["1 kg", "500 g", "4 pcs", "1 bunch"], 
              basePrice: 35 
          },
          "Snacks & Drinks": { 
              adjectives: ["Crunchy", "Spicy", "Classic", "Roasted", "Diet", "Fried", "Baked", "Sweet", "Savory", "Chilled", "Sparkling", "Fizzy"], 
              nouns: ["Potato Chips", "Cola Drink", "Almonds", "Cashews", "Green Tea", "Biscuits", "Cookies", "Nachos", "Energy Drink", "Juice", "Popcorn", "Peanuts"], 
              units: ["100 g", "200 g", "1.25 L", "500 ml"], 
              basePrice: 40 
          },
          "Atta, Rice & Staples": { 
              adjectives: ["Polished", "Aroma", "Chakki Fresh", "Pure", "Refined", "Premium", "Unpolished", "Organic", "Sortex", "Aged", "Golden", "Fortified"], 
              nouns: ["Basmati Rice", "Cooking Oil", "Atta", "Toor Dal", "Salt", "Sugar", "Moong Dal", "Chana Dal", "Poha", "Mustard Oil", "Jaggery", "Maida"], 
              units: ["1 kg", "5 kg", "1 L", "500 g"], 
              basePrice: 90 
          },
          "Personal Care": {
              adjectives: ["Herbal", "Refreshing", "Antibacterial", "Moisturizing", "Gentle", "Natural", "Deep Clean", "Soothing", "Fragrant", "Daily", "Whitening", "Silky"],
              nouns: ["Soap", "Shampoo", "Toothpaste", "Body Wash", "Face Wash", "Deodorant", "Hair Oil", "Lotion", "Talcum Powder", "Conditioner", "Hand Wash", "Scrub"],
              units: ["100 g", "200 ml", "500 ml", "1 pc"],
              basePrice: 120
          }
        };

        const generateCatalog = () => {
          const list = [];
          const categoryKeys = Object.keys(categoriesData);
          let idCounter = 1;
          for (let i = 0; i < 500; i++) {
            const catName = categoryKeys[i % categoryKeys.length];
            const cat = categoriesData[catName];
            const adj = cat.adjectives[i % cat.adjectives.length];
            const noun = cat.nouns[Math.floor(i / cat.adjectives.length) % cat.nouns.length];
            const unit = cat.units[i % cat.units.length];
            const price = parseFloat((cat.basePrice + ((i * 3.7) % 150)).toFixed(2));
            
            list.push({
              id: idCounter,
              barcode: `890${String(10000000 + idCounter).slice(1)}`,
              name: `${adj} ${noun} ${i + 1}`,
              category: catName,
              unit,
              stock: 500,
              price,
              discount: 0,
              mrp: parseFloat((price * 1.15).toFixed(2))
            });
            idCounter++;
          }
          return list;
        };

        const generateDummyOnlineOrders = (inv) => {
            return Array.from({length: 3}, (_, i) => {
                const item = inv[Math.floor(Math.random() * inv.length)];
                const qty = Math.floor(Math.random() * 3) + 1;
                const itemDiscount = item.discount || 0;
                const discountedPrice = item.price * (1 - (itemDiscount / 100));
                const subtotal = discountedPrice * qty;
                return {
                    id: `WEB-${Math.floor(10000 + Math.random() * 90000)}`,
                    customerName: `Online Customer ${Math.floor(Math.random() * 1000)}`,
                    customerMobile: `98765${Math.floor(10000 + Math.random() * 90000)}`,
                    customerAddress: `${Math.floor(Math.random() * 100) + 1}, Tech Park Road, Bengaluru, 560001`,
                    items: [{ ...item, qty }],
                    subtotal: subtotal,
                    grandTotal: subtotal * 1.05,
                    paymentMethod: 'Prepaid (UPI)',
                    timestamp: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }),
                    status: 'PENDING'
                };
            });
        };

        const STORAGE_INV = 'zippy_multi_inv_v4';
        const STORAGE_TX = 'zippy_multi_tx_v2';
        const STORAGE_USERS = 'zippy_multi_users_v2';
        const STORAGE_LOCK = 'zippy_db_mutex_lock';
        const STORAGE_SESSIONS = 'zippy_active_sessions'; 
        const STORAGE_ONLINE_ORDERS = 'zippy_online_orders_v2';

        function ZippyApp() {
          const [istTime, setIstTime] = useState('');
          
          useEffect(() => {
              const updateClock = () => {
                  const now = new Date();
                  const timeString = now.toLocaleString('en-IN', {
                      timeZone: 'Asia/Kolkata',
                      day: '2-digit',
                      month: 'short',
                      year: 'numeric',
                      hour12: true,
                      hour: '2-digit',
                      minute: '2-digit',
                      second: '2-digit'
                  });
                  setIstTime(timeString + ' IST');
              };
              updateClock();
              const timer = setInterval(updateClock, 1000);
              return () => clearInterval(timer);
          }, []);

          const [terminalId, setTerminalId] = useState(() => {
            const saved = sessionStorage.getItem('zippy_terminal_id');
            if (saved) return saved;
            const defaultTerm = "POS-TERM-01";
            sessionStorage.setItem('zippy_terminal_id', defaultTerm);
            return defaultTerm;
          });

          const [users, setUsers] = useState(() => {
            const saved = localStorage.getItem(STORAGE_USERS);
            return saved ? JSON.parse(saved) : [
              { empId: '001', name: 'Parthavi', username: 'parthavi', password: 'parthavi123', isManager: true },
              { empId: 'EMP-1001', name: 'Jajati Cashier', username: 'jajati', password: 'jajati123', isManager: false },
              { empId: 'EMP-1002', name: 'Gayatri Cashier', username: 'gayatri', password: 'gayatri123', isManager: false }
            ];
          });

          const [currentUser, setCurrentUser] = useState(() => {
            const saved = sessionStorage.getItem('zippy_active_user');
            return saved ? JSON.parse(saved) : null;
          });
          
          const [authMode, setAuthMode] = useState('login');
          const [loginForm, setLoginForm] = useState({ empId: '', password: '', selectedTerminal: terminalId });
          const [signupForm, setSignupForm] = useState({ name: '', password: '' });
          const [resetForm, setResetForm] = useState({ identifier: '', name: '', newPassword: '' });
          const [forceLogoutForm, setForceLogoutForm] = useState({ terminalId: terminalId, managerId: '', password: '' });

          const [activePortal, setActivePortal] = useState('pos');
          const [isManagerUnlocked, setIsManagerUnlocked] = useState(false);
          const [showManagerModal, setShowManagerModal] = useState(false);
          const [managerForm, setManagerForm] = useState({ username: '', password: '' });
          
          const [invStockFilter, setInvStockFilter] = useState('ALL');
          const [syncLog, setSyncLog] = useState([]);

          const [inventory, setInventory] = useState(() => {
            const saved = localStorage.getItem(STORAGE_INV);
            if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed.length >= 500) return parsed;
            }
            const fresh = generateCatalog();
            localStorage.setItem(STORAGE_INV, JSON.stringify(fresh));
            return fresh;
          });

          const [transactions, setTransactions] = useState(() => {
            const saved = localStorage.getItem(STORAGE_TX);
            return saved ? JSON.parse(saved) : [];
          });

          const [onlineOrders, setOnlineOrders] = useState(() => {
            const saved = localStorage.getItem(STORAGE_ONLINE_ORDERS);
            return saved ? JSON.parse(saved) : generateDummyOnlineOrders(generateCatalog());
          });

          const [posCart, setPosCart] = useState([]);
          const [posSearch, setPosSearch] = useState('');
          const [customerName, setCustomerName] = useState('');
          const [customerMobile, setCustomerMobile] = useState('');
          const [paymentMethod, setPaymentMethod] = useState('Cash'); 
          
          // New Card / Gift Card Payment States
          const [giftCardNumber, setGiftCardNumber] = useState('');
          const [cardLast4, setCardLast4] = useState('');

          const [isProcessingTx, setIsProcessingTx] = useState(false);
          const [isReturnMode, setIsReturnMode] = useState(false);
          
          // UPI Modal State
          const [showUpiModal, setShowUpiModal] = useState(false);
          const upiVpa = "zippy@upi";

          // Receipt Copy Selection State ('ALL', 'CUSTOMER', 'STORE')
          const [receiptCopyFilter, setReceiptCopyFilter] = useState('ALL');

          const [returnInvoiceSearch, setReturnInvoiceSearch] = useState('');
          const [originalTransaction, setOriginalTransaction] = useState(null);

          const [receiptModal, setReceiptModal] = useState({ isOpen: false, data: null });
          const channelRef = useRef(null);

          const addLog = (msg) => {
            setSyncLog(prev => [`[${new Date().toLocaleString('en-IN', {timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'})}] ${msg}`, ...prev.slice(0, 19)]);
          };

          useEffect(() => {
            localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
          }, [users]);

          useEffect(() => {
            localStorage.setItem(STORAGE_INV, JSON.stringify(inventory));
          }, [inventory]);

          useEffect(() => {
            localStorage.setItem(STORAGE_TX, JSON.stringify(transactions));
          }, [transactions]);

          useEffect(() => {
            localStorage.setItem(STORAGE_ONLINE_ORDERS, JSON.stringify(onlineOrders));
          }, [onlineOrders]);

          useEffect(() => {
            const channel = new BroadcastChannel('zippy_realtime_sync');
            channelRef.current = channel;

            channel.onmessage = (event) => {
              const { type, payload, sourceTerminal } = event.data;
              if (type === 'STOCK_UPDATE') {
                setInventory(payload.inventory);
                addLog(`Sync Event: Inventory stock updated centrally by ${sourceTerminal || 'Manager'}`);
              } else if (type === 'NEW_TRANSACTION') {
                setTransactions(payload.transactions);
                setInventory(payload.inventory);
                addLog(`Sync Event: Transaction completed/returned at ${sourceTerminal || 'System'}`);
              } else if (type === 'ONLINE_ORDER_PROCESSED') {
                setTransactions(payload.transactions);
                setInventory(payload.inventory);
                setOnlineOrders(payload.onlineOrders);
                addLog(`Sync Event: Online order processed at ${sourceTerminal}`);
              } else if (type === 'NEW_ONLINE_ORDER') {
                setOnlineOrders(payload.onlineOrders);
                addLog(`Sync Event: New online order/return request received`);
              }
            };

            const handleStorageChange = (e) => {
              if (e.key === STORAGE_INV && e.newValue) setInventory(JSON.parse(e.newValue));
              if (e.key === STORAGE_TX && e.newValue) setTransactions(JSON.parse(e.newValue));
              if (e.key === STORAGE_USERS && e.newValue) setUsers(JSON.parse(e.newValue));
              if (e.key === STORAGE_ONLINE_ORDERS && e.newValue) setOnlineOrders(JSON.parse(e.newValue));
              if (e.key === STORAGE_SESSIONS) {
                 const sessions = JSON.parse(e.newValue || '{}');
                 if (currentUser && !sessions[terminalId]) {
                    setCurrentUser(null);
                    sessionStorage.removeItem('zippy_active_user');
                 }
              }
            };

            window.addEventListener('storage', handleStorageChange);

            return () => {
              channel.close();
              window.removeEventListener('storage', handleStorageChange);
            };
          }, [currentUser, terminalId]);

          const acquireLock = async () => {
            let attempts = 0;
            while (localStorage.getItem(STORAGE_LOCK) === 'LOCKED' && attempts < 20) {
              await new Promise(r => setTimeout(r, 100));
              attempts++;
            }
            if (attempts >= 20) return false;
            localStorage.setItem(STORAGE_LOCK, 'LOCKED');
            return true;
          };

          const releaseLock = () => {
            localStorage.removeItem(STORAGE_LOCK);
          };

          const handleSignUp = (e) => {
            e.preventDefault();
            if (!signupForm.name || !signupForm.password) {
              return alert("Please fill in all details.");
            }
            const newEmpId = `EMP-${Math.floor(1000 + Math.random() * 9000)}`;
            const generatedUsername = signupForm.name.toLowerCase().replace(/\s+/g, '');
            const newUser = {
              empId: newEmpId,
              name: signupForm.name,
              username: generatedUsername,
              password: signupForm.password,
              isManager: false
            };
            const updatedUsers = [...users, newUser];
            setUsers(updatedUsers);
            alert(`Account Created Successfully!\nYour Employee ID is: ${newEmpId}\nYour Username is: ${generatedUsername}`);
            
            setSignupForm({ name: '', password: '' });
            setAuthMode('login');
          };

          const handleLogin = (e) => {
            e.preventDefault();
            const loginInput = loginForm.empId.toLowerCase().trim();
            
            const user = users.find(u => 
              (
                  u.empId.toLowerCase() === loginInput || 
                  u.name.toLowerCase() === loginInput || 
                  (u.username && u.username.toLowerCase() === loginInput) ||
                  (u.isManager && loginInput === 'admin')
              ) && 
              u.password === loginForm.password
            );
            
            if (!user) {
              return alert("Invalid Employee ID / Username or Password!");
            }

            const activeSessions = JSON.parse(localStorage.getItem(STORAGE_SESSIONS) || '{}');
            const existingUserSession = Object.entries(activeSessions).find(([term, empId]) => empId === user.empId);
            if (existingUserSession && existingUserSession[0] !== loginForm.selectedTerminal) {
               return alert(`Login Denied: You are already logged in to ${existingUserSession[0]}. Please log out from that machine first.`);
            }

            if (activeSessions[loginForm.selectedTerminal] && activeSessions[loginForm.selectedTerminal] !== user.empId) {
                return alert(`Login Denied: Terminal ${loginForm.selectedTerminal} is currently in use by another cashier.`);
            }

            activeSessions[loginForm.selectedTerminal] = user.empId;
            localStorage.setItem(STORAGE_SESSIONS, JSON.stringify(activeSessions));

            setTerminalId(loginForm.selectedTerminal);
            sessionStorage.setItem('zippy_terminal_id', loginForm.selectedTerminal);
            
            setCurrentUser(user);
            sessionStorage.setItem('zippy_active_user', JSON.stringify(user));
            setLoginForm({ ...loginForm, empId: '', password: '' });
          };

          const handleLogout = () => {
            const activeSessions = JSON.parse(localStorage.getItem(STORAGE_SESSIONS) || '{}');
            delete activeSessions[terminalId];
            localStorage.setItem(STORAGE_SESSIONS, JSON.stringify(activeSessions));

            setCurrentUser(null);
            setIsManagerUnlocked(false);
            sessionStorage.removeItem('zippy_active_user');
          };
          
          const handleResetPassword = (e) => {
            e.preventDefault();
            const identifier = resetForm.identifier.toLowerCase().trim();
            const fullName = resetForm.name.toLowerCase().trim();

            const userIndex = users.findIndex(u => 
                (u.empId.toLowerCase() === identifier || (u.username && u.username.toLowerCase() === identifier)) &&
                u.name.toLowerCase() === fullName
            );

            if (userIndex === -1) {
                return alert("Verification Failed: No account found matching that Username/Emp ID and Full Name.");
            }

            const updatedUsers = [...users];
            updatedUsers[userIndex].password = resetForm.newPassword;
            setUsers(updatedUsers);

            alert("Password Reset Successfully! You can now log in with your new password.");
            setResetForm({ identifier: '', name: '', newPassword: '' });
            setAuthMode('login');
          };

          const handleForceLogout = (e) => {
            e.preventDefault();
            const loginInput = forceLogoutForm.managerId.toLowerCase().trim();

            const user = users.find(u => 
                (
                    u.empId.toLowerCase() === loginInput || 
                    u.name.toLowerCase() === loginInput || 
                    (u.username && u.username.toLowerCase() === loginInput) ||
                    (u.isManager && loginInput === 'admin')
                ) && 
                u.password === forceLogoutForm.password
            );

            if (!user || !user.isManager) {
                return alert("Access Denied: Valid Store Manager credentials are required.");
            }

            const activeSessions = JSON.parse(localStorage.getItem(STORAGE_SESSIONS) || '{}');

            if (!activeSessions[forceLogoutForm.terminalId]) {
                return alert(`Terminal ${forceLogoutForm.terminalId} is not currently locked or in use.`);
            }

            delete activeSessions[forceLogoutForm.terminalId];
            localStorage.setItem(STORAGE_SESSIONS, JSON.stringify(activeSessions));

            alert(`Success: Terminal ${forceLogoutForm.terminalId} has been forcefully unlocked.`);
            setForceLogoutForm({ terminalId: terminalId, managerId: '', password: '' });
            setAuthMode('login'); 
          };

          const handleInitiatePosCheckout = () => {
            if (posCart.length === 0) return alert("POS cart is empty!");
            if (!customerMobile.trim() || customerMobile.length < 10) return alert("Valid 10-digit Mobile Number is required for transactions!");
            
            // Validate card details for Card / Gift Card modes
            if (paymentMethod === 'Gift Card' && giftCardNumber.length !== 16) {
                return alert("Please enter the full 16-digit Gift Card Number.");
            }
            if (paymentMethod === 'Card' && cardLast4.length !== 4) {
                return alert("Please tap the card to capture the last 4 digits.");
            }

            if (paymentMethod === 'UPI') {
                setShowUpiModal(true);
            } else {
                handleCompletePosSale();
            }
          };

          const handleCompletePosSale = async () => {
            setIsProcessingTx(true);

            const lockAcquired = await acquireLock();
            if (!lockAcquired) {
              setIsProcessingTx(false);
              return alert("System busy handling concurrent checkout! Please try again.");
            }

            try {
              const latestInv = JSON.parse(localStorage.getItem(STORAGE_INV)) || inventory;
              
              if (!isReturnMode) {
                const stockFailures = [];
                posCart.forEach(cartItem => {
                  const itemInDb = latestInv.find(i => i.id === cartItem.id);
                  if (!itemInDb || itemInDb.stock < cartItem.qty) {
                    stockFailures.push({ name: cartItem.name, available: itemInDb ? itemInDb.stock : 0 });
                  }
                });

                if (stockFailures.length > 0) {
                  const failMsg = stockFailures.map(f => `${f.name} (Only ${f.available} remaining)`).join('\n');
                  alert(`Transaction Rejected due to concurrent sale!\nStock updated:\n${failMsg}`);
                  setInventory(latestInv);
                  setIsProcessingTx(false);
                  releaseLock();
                  return;
                }
              }

              const updatedInv = latestInv.map(item => {
                const cartMatch = posCart.find(c => c.id === item.id);
                if (cartMatch) {
                    return { ...item, stock: isReturnMode ? item.stock + cartMatch.qty : item.stock - cartMatch.qty };
                }
                return item;
              });

              const multiplier = isReturnMode ? -1 : 1;
              const subtotal = posCart.reduce((a, b) => {
                  const itemDiscount = b.discount || 0;
                  const discountedPrice = b.price * (1 - (itemDiscount / 100));
                  return a + (discountedPrice * b.qty);
              }, 0) * multiplier;
              const grandTotal = subtotal * 1.05;

              let recordedCardLast4 = null;
              if (paymentMethod === 'Gift Card') recordedCardLast4 = giftCardNumber.slice(-4);
              else if (paymentMethod === 'Card') recordedCardLast4 = cardLast4;

              const newTx = {
                invoiceNumber: `${isReturnMode ? 'RET' : 'POS'}-${Date.now().toString().slice(-6)}`,
                terminalId: terminalId,
                cashier: `${currentUser.name} (${currentUser.empId})`,
                timestamp: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }),
                customerName: customerName || 'Walk-in Shopper',
                customerMobile: customerMobile,
                paymentMethod: paymentMethod,
                cardLast4: recordedCardLast4,
                items: posCart,
                subtotal,
                grandTotal,
                type: isReturnMode ? "RETURN" : "IN_STORE",
                originalInvoice: isReturnMode && originalTransaction ? originalTransaction.invoiceNumber : null
              };

              const updatedTxList = [newTx, ...transactions];

              setInventory(updatedInv);
              setTransactions(updatedTxList);
              localStorage.setItem(STORAGE_INV, JSON.stringify(updatedInv));
              localStorage.setItem(STORAGE_TX, JSON.stringify(updatedTxList));

              if (channelRef.current) {
                channelRef.current.postMessage({
                  type: 'NEW_TRANSACTION',
                  sourceTerminal: `${terminalId} [${currentUser.empId}]`,
                  payload: { inventory: updatedInv, transactions: updatedTxList }
                });
              }

              addLog(`Completed Tx ${newTx.invoiceNumber} on ${terminalId}`);
              setPosCart([]);
              setCustomerName('');
              setCustomerMobile('');
              setGiftCardNumber('');
              setCardLast4('');
              setOriginalTransaction(null);
              setReturnInvoiceSearch('');
              setShowUpiModal(false);
              setReceiptCopyFilter('ALL');
              setReceiptModal({ isOpen: true, data: newTx });
            } finally {
              releaseLock();
              setIsProcessingTx(false);
            }
          };

          const handleOpenInventory = () => {
            if (isManagerUnlocked || currentUser?.isManager) {
              setActivePortal('inventory');
            } else {
              setShowManagerModal(true);
            }
          };

          const handleVerifyManager = (e) => {
            e.preventDefault();
            const { username, password } = managerForm;
            if ((username.toLowerCase() === 'admin' || username === '001') && password === 'password123') {
              setIsManagerUnlocked(true);
              setShowManagerModal(false);
              setActivePortal('inventory');
              setManagerForm({ username: '', password: '' });
            } else {
              alert("Access Denied! Invalid Store Manager credentials.");
            }
          };

          const handleUpdateProductDetail = (productId, field, newValue) => {
            const updatedInv = inventory.map(item => {
                if (item.id === productId) {
                    let parsedValue = newValue;
                    if (field === 'stock') parsedValue = Math.max(0, parseInt(newValue) || 0);
                    if (field === 'price') parsedValue = Math.max(0, parseFloat(newValue) || 0);
                    if (field === 'discount') parsedValue = Math.max(0, parseFloat(newValue) || 0); 
                    
                    return { ...item, [field]: parsedValue };
                }
                return item;
            });

            setInventory(updatedInv);
            localStorage.setItem(STORAGE_INV, JSON.stringify(updatedInv));
            
            if (channelRef.current) {
                channelRef.current.postMessage({
                    type: 'STOCK_UPDATE',
                    sourceTerminal: 'Central Inventory Manager',
                    payload: { inventory: updatedInv }
                });
            }
          };

          const handleAddPosCart = (product) => {
            const liveItem = inventory.find(i => i.id === product.id);
            if (!liveItem || (liveItem.stock <= 0 && !isReturnMode)) return alert("Item out of stock!");

            setPosCart(prev => {
              const exists = prev.find(i => i.id === product.id);
              if (exists) {
                if (!isReturnMode && exists.qty + 1 > liveItem.stock) {
                  alert(`Stock Limit Reached! Only ${liveItem.stock} available.`);
                  return prev;
                }
                
                if (isReturnMode && originalTransaction) {
                    const originalPurchasedItem = originalTransaction.items.find(i => i.id === product.id);
                    if (originalPurchasedItem && exists.qty + 1 > originalPurchasedItem.qty) {
                        alert(`Cannot return more than originally purchased (${originalPurchasedItem.qty}).`);
                        return prev;
                    }
                }
                
                return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
              }
              return [...prev, { ...liveItem, qty: 1 }];
            });
          };

          const handleSimulateNewOnlineOrder = () => {
              const newOrders = generateDummyOnlineOrders(inventory).slice(0, 1);
              const updatedOrders = [...onlineOrders, ...newOrders];
              setOnlineOrders(updatedOrders);
              localStorage.setItem(STORAGE_ONLINE_ORDERS, JSON.stringify(updatedOrders));

          const handleProcessOnlineOrder = async (order) => {
              setIsProcessingTx(true);
              const lockAcquired = await acquireLock();
              if (!lockAcquired) {
                  setIsProcessingTx(false);
                  return alert("System busy handling concurrent checkout! Please try again.");
              }

              try {
                  const latestInv = JSON.parse(localStorage.getItem(STORAGE_INV)) || inventory;
                  const latestOrders = JSON.parse(localStorage.getItem(STORAGE_ONLINE_ORDERS)) || onlineOrders;
                  
                  if (!latestOrders.find(o => o.id === order.id)) {
                      alert("This order was already processed by another terminal!");
                      setOnlineOrders(latestOrders);
                      releaseLock();
                      setIsProcessingTx(false);
                      return;
                  }

                  const stockFailures = [];
                  
                  if (order.type !== 'RETURN') {
                      order.items.forEach(cartItem => {
                          const itemInDb = latestInv.find(i => i.id === cartItem.id);
                          if (!itemInDb || itemInDb.stock < cartItem.qty) {
                              stockFailures.push({ name: cartItem.name, available: itemInDb ? itemInDb.stock : 0 });
                          }
                      });
                  }

                  if (stockFailures.length > 0) {
                      alert(`Cannot process online order! Stock insufficient:\n${stockFailures.map(f => `${f.name} (Only ${f.available} remaining)`).join('\n')}`);
                      setInventory(latestInv);
                      releaseLock();
                      setIsProcessingTx(false);
                      return;
                  }

                  const updatedInv = latestInv.map(item => {
                      const cartMatch = order.items.find(c => c.id === item.id);
                      if (cartMatch) {
                          return { ...item, stock: order.type === 'RETURN' ? item.stock + cartMatch.qty : item.stock - cartMatch.qty };
                      }
                      return item;

                  const newTx = {
                      invoiceNumber: order.id, 
                      terminalId: terminalId,
                      cashier: `${currentUser.name} (${currentUser.empId})`,
                      timestamp: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }),
                      customerName: order.customerName,
                      customerMobile: order.customerMobile,
                      customerAddress: order.customerAddress,
                      paymentMethod: order.paymentMethod,
                      items: order.items,
                      subtotal: order.subtotal,
                      grandTotal: order.grandTotal,
                      type: order.type === 'RETURN' ? "RETURN" : "ONLINE",
                      originalInvoice: order.originalInvoice
                  };

                  const updatedTxList = [newTx, ...transactions];
                  const updatedOrders = latestOrders.filter(o => o.id !== order.id);

                  setInventory(updatedInv);
                  setTransactions(updatedTxList);
                  setOnlineOrders(updatedOrders);
                  
                  localStorage.setItem(STORAGE_INV, JSON.stringify(updatedInv));
                  localStorage.setItem(STORAGE_TX, JSON.stringify(updatedTxList));
                  localStorage.setItem(STORAGE_ONLINE_ORDERS, JSON.stringify(updatedOrders));

                          type: 'ONLINE_ORDER_PROCESSED',
                          sourceTerminal: `${terminalId} [${currentUser.empId}]`,
                          payload: { inventory: updatedInv, transactions: updatedTxList, onlineOrders: updatedOrders }

                  {/* Dual Thermal Receipt Modal (Customer Copy + Store Copy) */}
                  {receiptModal.isOpen && receiptModal.data && (
                    <div className="fixed inset-0 z-50 bg-black/60 flex items-start justify-center pt-6 pb-10 overflow-y-auto print:p-0 p-4">
                      <div className="bg-white rounded-lg shadow-2xl relative w-full" style={{ maxWidth: '380px' }}>
                        
                        {/* Interactive Receipts Copy Filter Tabs (No-Print) */}
                        <div className="no-print p-3 border-b bg-slate-50 rounded-t-lg flex items-center justify-between">
                            <span className="text-[11px] font-bold text-slate-700">Receipt Copies:</span>
                            <div className="flex gap-1 bg-slate-200 p-1 rounded-lg text-[10px] font-bold">
                                <button 
                                  onClick={() => setReceiptCopyFilter('ALL')} 
                                  className={`px-2 py-1 rounded ${receiptCopyFilter === 'ALL' ? 'bg-slate-900 text-amber-400' : 'text-slate-700'}`}
                                >
                                  Both Copies
                                </button>
                                <button 
                                  onClick={() => setReceiptCopyFilter('CUSTOMER')} 
                                  className={`px-2 py-1 rounded ${receiptCopyFilter === 'CUSTOMER' ? 'bg-slate-900 text-amber-400' : 'text-slate-700'}`}
                                >
                                  Customer Copy
                                </button>
                                <button 
                                  onClick={() => setReceiptCopyFilter('STORE')} 
                                  className={`px-2 py-1 rounded ${receiptCopyFilter === 'STORE' ? 'bg-slate-900 text-amber-400' : 'text-slate-700'}`}
                                >
                                  Store Copy
                                </button>
                            </div>
                        </div>

                        <div id="printable-receipt-area" className="w-full mx-auto bg-white">
                          
                          {(['IN_STORE', 'RETURN'].includes(receiptModal.data.type) 
                             ? ['CUSTOMER COPY', 'STORE COPY'] 
                             : ['CUSTOMER COPY']
                           )
                           .filter(copyType => {
                              if (receiptCopyFilter === 'CUSTOMER') return copyType === 'CUSTOMER COPY';
                              if (receiptCopyFilter === 'STORE') return copyType === 'STORE COPY';
                              return true;
                           })
                           .map((copyType, index) => (
                            <div 
                              key={index} 
                              className="thermal-receipt text-[11px] p-5 w-full mx-auto receipt-copy-block"
                            >
                              
                              <div className="text-center font-bold">
                                <span className="inline-block border border-black px-2 py-0.5 text-[10px] font-black uppercase mb-1">
                                    *** {copyType} ***
                                </span>
                                <h2 className="text-xl tracking-tight mb-0.5">ZIPPY SUPERMARKET</h2>
                                <p>Outer Ring Road, Bengaluru</p>
                                <p>GSTIN: 29ABCDE1234F1Z5</p>
                                <p>Ph: 1800-123-4567</p>
                              </div>
                              
                              <div className="divider"></div>
                              
                              <div className="space-y-1">
                                <div className="flex justify-between">
                                    <span>TERM: {receiptModal.data.terminalId}</span>
                                    <span>CASHIER: {receiptModal.data.cashier.split(' ')[0].toUpperCase()}</span>
                                </div>
                                <div className="flex justify-between">
                                    <span>INV: {receiptModal.data.invoiceNumber}</span>
                                    <span className="text-right">{receiptModal.data.timestamp}</span>
                                </div>
                                <div className="flex justify-between">
                                    <span>TYPE: {receiptModal.data.type}</span>
                                    <span>MODE: {receiptModal.data.paymentMethod.toUpperCase()}</span>
                                </div>
                                
                                {receiptModal.data.cardLast4 && (
                                    <div className="flex justify-between font-bold">
                                        <span>CARD NUM:</span>
                                        <span>**** **** **** {receiptModal.data.cardLast4}</span>
                                    </div>
                                )}
                                
                                {receiptModal.data.originalInvoice && (
                                    <div className="flex justify-between font-bold">
                                        <span>ORIG REF:</span>
                                        <span>{receiptModal.data.originalInvoice}</span>
                                    </div>
                                )}
                              </div>

                              <div className="divider"></div>
                              
                              {receiptModal.data.customerName && (
                                <>
                                  <div className="space-y-1">
                                    <p>CUST: {receiptModal.data.customerName.toUpperCase()}</p>
                                    {receiptModal.data.customerMobile && <p>MOB: {receiptModal.data.customerMobile}</p>}
                                    {receiptModal.data.customerAddress && <p>ADD: {receiptModal.data.customerAddress.toUpperCase()}</p>}
                                  </div>
                                  <div className="divider"></div>
                                </>
                              )}

                              <table className="text-left w-full">
                                <thead>
                                  <tr>
                                    <th className="w-1/2">ITEM</th>
                                    <th className="w-1/4 text-center">QTY</th>
                                    <th className="w-1/4 text-right">AMT</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {receiptModal.data.items.map((it, idx) => {
                                      const itemDiscount = it.discount || 0;
                                      const discountedPrice = it.price * (1 - (itemDiscount / 100));
                                      
                                      return (
                                        <tr key={idx}>
                                          <td>
                                            {it.name.toUpperCase()} 
                                            {itemDiscount > 0 && ` (-${itemDiscount}%)`}
                                          </td>
                                          <td className="text-center">{it.qty}</td>
                                          <td className="text-right">{(discountedPrice * it.qty).toFixed(2)}</td>
                                        </tr>
                                      );
                                  })}
                                </tbody>
                              </table>
                              
                              <div className="divider"></div>
                              
                              <div className="space-y-1">
                                <div className="flex justify-between">
                                  <span>SUBTOTAL:</span>
                                  <span>{Math.abs(receiptModal.data.subtotal).toFixed(2)}</span>
                                </div>
                                <div className="flex justify-between">
                                  <span>CGST (2.5%):</span>
                                  <span>{Math.abs(receiptModal.data.subtotal * 0.025).toFixed(2)}</span>
                                </div>
                                <div className="flex justify-between">
                                  <span>SGST (2.5%):</span>
                                  <span>{Math.abs(receiptModal.data.subtotal * 0.025).toFixed(2)}</span>
                                </div>
                                <div className="divider"></div>
                                <div className="flex justify-between font-bold text-sm">
                                  <span>{receiptModal.data.type === 'RETURN' ? 'TOTAL REFUND:' : 'GRAND TOTAL:'}</span>
                                  <span>{Math.abs(receiptModal.data.grandTotal).toFixed(2)}</span>
                                </div>
                              </div>
                              
                              <div className="divider"></div>
                              
                              <div className="text-center mt-3">
                                <p className="font-bold">*** THANK YOU FOR SHOPPING ***</p>
                                <p className="mt-0.5">PLEASE VISIT US AGAIN</p>
                                
                                <div className="mt-3 flex flex-col items-center">
                                    <div className="text-xl tracking-tighter" style={{ fontFamily: 'monospace' }}>
                                        || ||| | ||| || || | || |||
                                    </div>
                                    <div className="text-[9px] mt-1">{receiptModal.data.invoiceNumber}</div>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>

                        <div className="flex gap-2 p-4 pt-2 border-t border-slate-200 no-print bg-white rounded-b-lg">
                          <button 
                            onClick={handlePrintReceipt} 
                            className="flex-1 py-2.5 bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold text-xs rounded-lg shadow-sm transition"
                          >
                            🖨️ Print Selected ({receiptCopyFilter})
                          </button>
                          <button 
                            onClick={() => setReceiptModal({ isOpen: false, data: null })} 
                            className="flex-1 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-lg shadow-sm transition"
                          >
                            Close Window
                          </button>
                        </div>

                      </div>
                    </div>
                  )}
                </>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ZippyApp />);
    </script>
</body>
</html>
