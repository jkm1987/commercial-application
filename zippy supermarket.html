<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zippy Supermarket - POS & Quick Commerce</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone compiler for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }

        @media print {
            body * { visibility: hidden; }
            #printable-receipt-area, #printable-receipt-area * { visibility: visible; }
            #printable-receipt-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Expanded Base Vocabulary to generate 1,000 Unique SKUs
        const categoriesData = {
          "Dairy & Bakery": {
            adjectives: ["Organic", "Farm Fresh", "Greek", "Salted", "Unsalted", "Probiotic", "Artisan", "Whole", "Skimmed", "Double Cream", "Chilled", "Sweetened", "Cultured", "Traditional", "Homestyle"],
            nouns: ["Milk", "Brown Bread", "White Bread", "Butter", "Paneer", "Cheddar Cheese", "Mozzarella Block", "Greek Yogurt", "Buttermilk", "Whipped Cream", "Condensed Milk", "Mawa", "Sourdough", "Milk Rusk", "Vanilla Custard", "Cottage Cheese", "Processed Cheese Spread", "Chocolate Milk", "Paneer Cubes", "Buns"],
            units: ["1 L", "400 g", "500 g", "200 g", "1 kg", "150 g", "250 ml", "6 pcs"],
            basePrice: 50
          },
          "Fruits & Vegetables": {
            adjectives: ["Fresh", "Ripe", "Juicy", "Crisp", "Sourced", "Local", "Premium", "Raw", "Himalayan", "Sorted", "Organic", "Tender", "Green", "Firm", "Sweet"],
            nouns: ["Cavendish Bananas", "Hybrid Tomatoes", "Red Onions", "Idaho Potatoes", "Royal Gala Apples", "Baby Carrots", "Fresh Broccoli", "English Cucumbers", "Capsicum", "Lemons", "Fresh Garlic", "Ginger Root", "Spinach Bunch", "Fresh Mint", "Green Peas", "Pomegranate Seeds", "Fresh Mushrooms", "Ripe Papaya", "Fresh Coconut", "Sweet Corn"],
            units: ["1 kg", "500 g", "4 pcs", "1 bunch", "250 g"],
            basePrice: 35
          },
          "Snacks & Drinks": {
            adjectives: ["Crunchy", "Spicy", "Classic", "Roasted", "Salted", "Tangy", "Sweet", "Fizzy", "Chilled", "Herbal", "Diet", "Smoked", "Masala", "Puffed", "Baked"],
            nouns: ["Potato Chips", "Cola Drink", "Almonds", "Cashews", "Green Tea Bags", "Mixed Fruit Juice", "Lemon Soda", "Dark Chocolate", "Digestive Biscuits", "Cream Cookies", "Instant Noodles", "Salty Pretzels", "Popcorn", "Peanut Butter", "Energy Drink", "Malted Milk Drink", "Toasted Cornflakes", "Oats Granola", "Dry Mango Chips", "Bhujia Sev"],
            units: ["100 g", "200 g", "1.25 L", "500 ml", "150 g", "250 g"],
            basePrice: 40
          },
          "Atta, Rice & Staples": {
            adjectives: ["Polished", "Unpolished", "Aroma", "Chakki Fresh", "Pure", "Refined", "Organic", "Sorted", "Boiled", "Long Grain", "Whole", "Split", "Raw", "Traditional", "Superfine"],
            nouns: ["Basmati Rice", "Sunflower Cooking Oil", "Whole Wheat Atta", "Toor Dal", "Moong Dal", "Chana Dal", "Urad Dal", "Yellow Maize Flour", "Sona Masuri Rice", "Mustard Oil", "Groundnut Oil", "Poha Flakes", "Semolina Sooji", "Maida Flour", "Pink Salt", "Iodized Table Salt", "Cumin Seeds", "Turmeric Powder", "Red Chilli Powder", "Coriander Powder"],
            units: ["1 kg", "5 kg", "10 kg", "1 L", "500 g"],
            basePrice: 90
          },
          "Household": {
            adjectives: ["Lemon Fresh", "Lavender", "Anti-Bacterial", "Heavy Duty", "Ultra Clean", "Matte", "Eco-Friendly", "Fragrant", "Multi-Surface", "Concentrated", "Disinfectant", "Soft", "Absorbent", "Quick Dry", "Deep Action"],
            nouns: ["Dishwash Gel", "Floor Cleaner", "Toilet Cleaner", "Glass Cleaner", "Laundry Detergent Powder", "Liquid Detergent", "Trash Bags", "Tissue Paper Rolls", "Kitchen Paper Towels", "Mosquito Vaporizer Refill", "Steel Scrubber", "Dishwash Sponge", "Phenyl Liquid", "Fabric Softener", "Air Freshener Spray", "Napkin Rings", "Aluminium Foil Roll", "Baking Soda", "Surface Wipe Cloth", "Handy Broom"],
            units: ["500 ml", "1 L", "1 kg", "10 pcs", "3 rolls", "500 g"],
            basePrice: 110
          },
          "Personal Care": {
            adjectives: ["Nourishing", "Hydrating", "Herbal", "Refreshing", "Soothing", "Gentle", "Moisturizing", "Deep Clean", "Clear", "Glossy", "Silky", "Repairing", "Glowing", "Protected", "Daily Care"],
            nouns: ["Handwash Refill", "Herbal Shampoo", "Conditioner", "Bath Soap Bar", "Body Lotion", "Toothpaste", "Toothbrush", "Face Wash", "Talcum Powder", "Shaving Cream", "Razor Cartridges", "Hair Oil", "Lip Balm", "Aloe Vera Gel", "Shower Gel", "Cotton Buds", "Sanitary Pads", "Wet Wipes", "Deodorant Roll-on", "Foot Cream"],
            units: ["250 ml", "150 ml", "100 g", "75 g", "200 ml", "12 pcs"],
            basePrice: 75
          }
        };

        const generate1000ZippyInventory = () => {
          const list = [];
          const categoryKeys = Object.keys(categoriesData);
          let idCounter = 1;

          for (let i = 0; i < 1000; i++) {
            const categoryName = categoryKeys[i % categoryKeys.length];
            const catInfo = categoriesData[categoryName];

            const adj = catInfo.adjectives[i % catInfo.adjectives.length];
            const noun = catInfo.nouns[Math.floor(i / catInfo.adjectives.length) % catInfo.nouns.length];
            const unit = catInfo.units[i % catInfo.units.length];

            const itemPrice = parseFloat((catInfo.basePrice + ((i * 3.7) % 150)).toFixed(2));
            const itemMrp = parseFloat((itemPrice * 1.15).toFixed(2));

            list.push({
              id: idCounter,
              barcode: `890${String(10000000 + idCounter).slice(1)}`,
              name: `${adj} ${noun} ${i + 1}`,
              category: categoryName,
              unit: unit,
              stock: 50,
              price: itemPrice,
              mrp: itemMrp,
              aisle: `Aisle ${(i % 12) + 1}-Shelf ${String.fromCharCode(65 + (i % 6))}`
            });
            idCounter++;
          }
          return list;
        };

        const defaultUsers = [
          { userId: "ZIP-USR-100001", username: "admin", password: "password123", name: "Store Manager" }
        ];

        const STORAGE_USERS = 'zippy_users_v7';
        const STORAGE_CURRENT_USER = 'zippy_active_user_v7';
        const STORAGE_INV = 'zippy_html_inv_v1000_v7';
        const STORAGE_TX = 'zippy_html_tx_v1000_v7';
        const STORAGE_ORDERS = 'zippy_html_orders_v1000_v7';

        function ZippyApp() {
          const [users, setUsers] = useState(() => {
            const saved = localStorage.getItem(STORAGE_USERS);
            return saved ? JSON.parse(saved) : defaultUsers;
          });

          const [currentUser, setCurrentUser] = useState(() => {
            const saved = localStorage.getItem(STORAGE_CURRENT_USER);
            return saved ? JSON.parse(saved) : null;
          });

          const [authMode, setAuthMode] = useState('login');
          const [inputUsername, setInputUsername] = useState('');
          const [inputPassword, setInputPassword] = useState('');
          const [authError, setAuthError] = useState('');

          const [activePortal, setActivePortal] = useState('online_store');
          
          const [inventory, setInventory] = useState(() => {
            const saved = localStorage.getItem(STORAGE_INV);
            return saved ? JSON.parse(saved) : generate1000ZippyInventory();
          });

          const [transactions, setTransactions] = useState(() => {
            const saved = localStorage.getItem(STORAGE_TX);
            return saved ? JSON.parse(saved) : [];
          });

          const [onlineOrders, setOnlineOrders] = useState(() => {
            const saved = localStorage.getItem(STORAGE_ORDERS);
            return saved ? JSON.parse(saved) : [];
          });

          const [onlineCart, setOnlineCart] = useState([]);
          const [onlineCustomerName, setOnlineCustomerName] = useState("");
          const [onlineCustomerPhone, setOnlineCustomerPhone] = useState("");
          const [deliveryAddress, setDeliveryAddress] = useState("Koramangala 4th Block, Bengaluru");
          const [selectedCategory, setSelectedCategory] = useState("All");
          const [onlineSearch, setOnlineSearch] = useState('');
          const [onlinePaymentMode, setOnlinePaymentMode] = useState('UPI');

          const [posCart, setPosCart] = useState([]);
          const [posSearch, setPosSearch] = useState('');
          const [customerName, setCustomerName] = useState('');
          const [customerPhone, setCustomerPhone] = useState('');
          const [posPaymentMode, setPosPaymentMode] = useState('UPI');

          const [currentPage, setCurrentPage] = useState(1);
          const [invSearch, setInvSearch] = useState('');
          const [invCategoryFilter, setInvCategoryFilter] = useState('All');
          const [invStockStatusFilter, setInvStockStatusFilter] = useState('All');
          const itemsPerPage = 10;

          const [receiptModal, setReceiptModal] = useState({ isOpen: false, data: null });
          const [isSkuModalOpen, setIsSkuModalOpen] = useState(false);
          const [editingSku, setEditingSku] = useState(null);
          const [skuForm, setSkuForm] = useState({
            name: '', category: 'Dairy & Bakery', stock: '50', price: '', mrp: '', barcode: '', unit: '1 pc', aisle: 'Aisle 1-Shelf A'
          });

          useEffect(() => localStorage.setItem(STORAGE_USERS, JSON.stringify(users)), [users]);
          useEffect(() => {
            if (currentUser) localStorage.setItem(STORAGE_CURRENT_USER, JSON.stringify(currentUser));
            else localStorage.removeItem(STORAGE_CURRENT_USER);
          }, [currentUser]);
          useEffect(() => localStorage.setItem(STORAGE_INV, JSON.stringify(inventory)), [inventory]);
          useEffect(() => localStorage.setItem(STORAGE_TX, JSON.stringify(transactions)), [transactions]);
          useEffect(() => localStorage.setItem(STORAGE_ORDERS, JSON.stringify(onlineOrders)), [onlineOrders]);
          useEffect(() => setCurrentPage(1), [invSearch, invCategoryFilter, invStockStatusFilter]);

          const handleLogin = (e) => {
            e.preventDefault();
            setAuthError('');
            const foundUser = users.find(u => u.username.toLowerCase() === inputUsername.trim().toLowerCase() && u.password === inputPassword);
            if (foundUser) {
              setCurrentUser(foundUser);
              setInputUsername('');
              setInputPassword('');
            } else {
              setAuthError('Invalid Username or Password. (Demo: admin / password123)');
            }
          };

          const handleSignUp = (e) => {
            e.preventDefault();
            setAuthError('');
            if (!inputUsername.trim() || !inputPassword.trim()) {
              setAuthError('Username and Password are required.');
              return;
            }

            const existing = users.find(u => u.username.toLowerCase() === inputUsername.trim().toLowerCase());
            if (existing) {
              setAuthError('Username already taken. Please choose another.');
              return;
            }

            const newUserId = `ZIP-USR-${Math.floor(100000 + Math.random() * 900000)}`;
            const newUser = {
              userId: newUserId,
              username: inputUsername.trim(),
              password: inputPassword,
              name: inputUsername.trim()
            };

            setUsers([...users, newUser]);
            setCurrentUser(newUser);
            setInputUsername('');
            setInputPassword('');
            alert(`Registration successful! Your generated User ID is: ${newUserId}`);
          };

          const handleLogout = () => {
            setCurrentUser(null);
          };

          const handleOpenAddModal = () => {
            setEditingSku(null);
            setSkuForm({
              name: '',
              category: 'Dairy & Bakery',
              stock: '50',
              price: '100',
              mrp: '115',
              barcode: `890${Math.floor(10000000 + Math.random() * 90000000)}`,
              unit: '1 pc',
              aisle: 'Aisle 1-Shelf A'
            });
            setIsSkuModalOpen(true);
          };

          const handleOpenEditModal = (item) => {
            setEditingSku(item);
            setSkuForm({
              name: item.name,
              category: item.category,
              stock: item.stock.toString(),
              price: item.price.toString(),
              mrp: item.mrp.toString(),
              barcode: item.barcode,
              unit: item.unit,
              aisle: item.aisle || 'Aisle General'
            });
            setIsSkuModalOpen(true);
          };

          const handleSaveSku = (e) => {
            e.preventDefault();
            const stockVal = parseInt(skuForm.stock, 10);
            const priceVal = parseFloat(skuForm.price);
            const mrpVal = parseFloat(skuForm.mrp) || priceVal * 1.15;

            if (isNaN(stockVal) || isNaN(priceVal)) {
              alert("Please enter valid numerical values for Stock and Price.");
              return;
            }

            if (editingSku) {
              setInventory(prev => prev.map(i => i.id === editingSku.id ? {
                ...i,
                name: skuForm.name,
                category: skuForm.category,
                stock: stockVal,
                price: priceVal,
                mrp: parseFloat(mrpVal.toFixed(2)),
                barcode: skuForm.barcode,
                unit: skuForm.unit,
                aisle: skuForm.aisle
              } : i));
            } else {
              const newSku = {
                id: Date.now(),
                barcode: skuForm.barcode || `890${Math.floor(10000000 + Math.random() * 90000000)}`,
                name: skuForm.name,
                category: skuForm.category,
                unit: skuForm.unit || "1 pc",
                stock: stockVal,
                price: priceVal,
                mrp: parseFloat(mrpVal.toFixed(2)),
                aisle: skuForm.aisle || "Aisle General"
              };
              setInventory([newSku, ...inventory]);
            }
            setIsSkuModalOpen(false);
          };

          const handleDeleteSku = (id) => {
            if (confirm("Are you sure you want to delete this product from the master catalog?")) {
              setInventory(prev => prev.filter(i => i.id !== id));
            }
          };

          const handleResetCatalog = () => {
            if (confirm("Reset catalog back to default 1,000 unique SKUs (all set to 50 stock)?")) {
              const fresh = generate1000ZippyInventory();
              setInventory(fresh);
            }
          };

          const handleAddOnlineCart = (product) => {
            if (product.stock <= 0) return alert("Item out of stock!");
            setOnlineCart(prev => {
              const exists = prev.find(i => i.id === product.id);
              if (exists) {
                if (exists.qty + 1 > product.stock) {
                  alert("Maximum available stock reached!");
                  return prev;
                }
                return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
              }
              return [...prev, { ...product, qty: 1 }];
            });
          };

          const handlePlaceOnlineOrder = () => {
            if (onlineCart.length === 0) return alert("Cart is empty!");
            const subtotal = onlineCart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
            const deliveryFee = 15;
            const totalAmount = subtotal + deliveryFee;
            
            const finalCustomerName = onlineCustomerName.trim() || (currentUser ? currentUser.name : "Online Customer");
            const finalPhone = onlineCustomerPhone.trim() || "9988776655";

            const newOrder = {
              orderId: `ZIP-ONLINE-${Math.floor(1000 + Math.random() * 9000)}`,
              invoiceNumber: `ZIP-ONLINE-${Math.floor(1000 + Math.random() * 9000)}`,
              customerName: finalCustomerName,
              phone: finalPhone,
              address: deliveryAddress,
              paymentMode: onlinePaymentMode,
              status: "PLACED",
              type: "ONLINE",
              timestamp: new Date().toLocaleString(),
              items: onlineCart.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty, total: i.price * i.qty })),
              subtotal,
              deliveryFee,
              grandTotal: totalAmount,
              totalAmount
            };

            setInventory(prev => prev.map(item => {
              const match = onlineCart.find(c => c.id === item.id);
              return match ? { ...item, stock: item.stock - match.qty } : item;
            }));

            setOnlineOrders([newOrder, ...onlineOrders]);
            setOnlineCart([]);
            setOnlineCustomerName("");
            setOnlineCustomerPhone("");
            alert(`Order Placed via ${onlinePaymentMode}! Reference ID: ${newOrder.orderId}`);
            setActivePortal('online_dispatch');
          };

          const handleAddPosCart = (product) => {
            if (product.stock <= 0) return alert("Item out of stock!");
            setPosCart(prev => {
              const exists = prev.find(i => i.id === product.id);
              if (exists) {
                if (exists.qty + 1 > product.stock) {
                  alert(`Only ${product.stock} units left on shelf!`);
                  return prev;
                }
                return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
              }
              return [...prev, { ...product, qty: 1 }];
            });
          };

          const calculatePosTotals = () => {
            let subtotal = 0;
            posCart.forEach(i => subtotal += i.price * i.qty);
            const gstTotal = subtotal * 0.05;
            const grandTotal = subtotal + gstTotal;
            return { subtotal, gstTotal, grandTotal };
          };

          const handleCompletePosSale = () => {
            if (posCart.length === 0) return alert("POS cart is empty!");
            const { subtotal, gstTotal, grandTotal } = calculatePosTotals();
            const invoiceNumber = `ZIP-POS-${Date.now().toString().slice(-6)}`;

            const newTx = {
              invoiceNumber,
              timestamp: new Date().toLocaleString(),
              customerName: customerName.trim() || 'In-Store Shopper',
              customerPhone: customerPhone.trim() || 'N/A',
              paymentMode: posPaymentMode,
              cashier: currentUser ? `${currentUser.name} (${currentUser.userId})` : 'System',
              items: posCart.map(c => ({ id: c.id, name: c.name, price: c.price, qty: c.qty, total: c.price * c.qty })),
              subtotal,
              gstTotal,
              grandTotal,
              type: "IN_STORE"
            };

            setInventory(prev => prev.map(item => {
              const match = posCart.find(c => c.id === item.id);
              return match ? { ...item, stock: item.stock - match.qty } : item;
            }));

            setTransactions([newTx, ...transactions]);
            setPosCart([]);
            setCustomerName('');
            setCustomerPhone('');
            setReceiptModal({ isOpen: true, data: newTx });
          };

          const totalSkuCount = inventory.length;
          const inStockCount = inventory.filter(i => i.stock > 10).length;
          const lowStockCount = inventory.filter(i => i.stock > 0 && i.stock <= 10).length;
          const emptyStockCount = inventory.filter(i => i.stock === 0).length;

          const filteredInventory = inventory.filter(i => {
            const matchesSearch = i.name.toLowerCase().includes(invSearch.toLowerCase()) || i.barcode.includes(invSearch);
            const matchesCategory = invCategoryFilter === 'All' || i.category === invCategoryFilter;
            
            let matchesStatus = true;
            if (invStockStatusFilter === 'InStock') matchesStatus = i.stock > 10;
            else if (invStockStatusFilter === 'LowStock') matchesStatus = i.stock > 0 && i.stock <= 10;
            else if (invStockStatusFilter === 'Empty') matchesStatus = i.stock === 0;

            return matchesSearch && matchesCategory && matchesStatus;
          });

          const totalPages = Math.ceil(filteredInventory.length / itemsPerPage) || 1;
          const currentInvPageItems = filteredInventory.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

          if (!currentUser) {
            return (
              <div className="min-h-screen flex items-center justify-center bg-slate-200 p-4">
                <div className="bg-white rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-xl border border-slate-300">
                  <div className="text-center mb-6">
                    <div className="inline-block bg-slate-900 text-amber-400 font-black text-3xl px-4 py-1.5 rounded-xl italic mb-2">zippy</div>
                    <h2 className="text-base sm:text-lg font-extrabold text-slate-800">Supermarket Login Portal</h2>
                    <p className="text-xs text-slate-500">Sign in to manage POS, Inventory & Orders</p>
                  </div>

                  <form onSubmit={authMode === 'login' ? handleLogin : handleSignUp} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">USERNAME</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="Enter Username" 
                        className="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none"
                        value={inputUsername}
                        onChange={e => setInputUsername(e.target.value)}
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">PASSWORD</label>
                      <input 
                        type="password" 
                        required 
                        placeholder="Enter Password" 
                        className="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none"
                        value={inputPassword}
                        onChange={e => setInputPassword(e.target.value)}
                      />
                    </div>

                    {authError && <p className="text-xs text-red-600 font-semibold bg-red-50 p-2.5 rounded-lg border border-red-200">{authError}</p>}

                    <button type="submit" className="w-full py-2.5 bg-amber-400 hover:bg-amber-500 text-slate-900 font-black text-sm rounded-xl transition shadow-md">
                      {authMode === 'login' ? 'LOG IN' : 'CREATE USER & GENERATE ID'}
                    </button>
                  </form>

                  <div className="mt-6 text-center border-t pt-4">
                    {authMode === 'login' ? (
                      <p className="text-xs text-slate-600">
                        New user?{" "}
                        <button onClick={() => { setAuthMode('signup'); setAuthError(''); }} className="font-bold text-slate-900 underline">Create New Account</button>
                      </p>
                    ) : (
                      <p className="text-xs text-slate-600">
                        Already have an account?{" "}
                        <button onClick={() => { setAuthMode('login'); setAuthError(''); }} className="font-bold text-slate-900 underline">Sign In</button>
                      </p>
                    )}
                  </div>

                  <div className="mt-4 p-3 bg-slate-50 rounded-xl text-[11px] text-slate-500 space-y-0.5">
                    <p className="font-bold text-slate-700">Quick Demo Credentials:</p>
                    <p>Username: <strong className="text-slate-900">admin</strong></p>
                    <p>Password: <strong className="text-slate-900">password123</strong></p>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen flex flex-col w-full overflow-x-hidden">
              <header className="bg-amber-400 border-b border-amber-500 sticky top-0 z-40 shadow-sm no-print">
                <div className="max-w-7xl mx-auto px-2 sm:px-4 py-2 sm:py-0 min-h-[4rem] flex flex-col sm:flex-row items-center justify-between gap-2">
                  <div className="w-full sm:w-auto flex items-center justify-between sm:justify-start">
                    <div className="flex items-center space-x-2">
                      <div className="bg-slate-900 text-amber-400 font-black text-lg sm:text-xl px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-lg italic">zippy</div>
                      <div>
                        <span className="text-[11px] sm:text-xs font-black uppercase text-slate-900 tracking-wider block leading-none">Supermarket</span>
                        <span className="text-[9px] sm:text-[10px] text-slate-800 font-bold">{inventory.length} Master SKUs</span>
                      </div>
                    </div>

                    <div className="flex sm:hidden items-center space-x-2 bg-slate-900 text-white px-2 py-1 rounded-lg text-[10px]">
                      <div>
                        <p className="font-black text-amber-400 truncate max-w-[80px]">{currentUser.name}</p>
                      </div>
                      <button onClick={handleLogout} className="bg-red-600 text-white font-bold px-1.5 py-0.5 rounded">Exit</button>
                    </div>
                  </div>

                  <div className="w-full sm:w-auto flex space-x-1 bg-amber-500/40 p-1 rounded-xl overflow-x-auto max-w-full">

                  </div>

                      <input type="text" placeholder="Search SKUs by Name or Barcode..." className="px-3 py-2 border rounded-lg text-xs w-full sm:w-64" value={invSearch} onChange={(e) => setInvSearch(e.target.value)} />

                        <option value="Fruits & Vegetables">Fruits & Vegetables</option>
                        <option value="Snacks & Drinks">Snacks & Drinks</option>
                        <option value="Atta, Rice & Staples">Atta, Rice & Staples</option>
                        <option value="Household">Household</option>
                        <option value="Personal Care">Personal Care</option>

                          <th className="p-3">In-Stock</th>

                            <th className="p-2.5">Delivery Address</th>
                            <th className="p-2.5">Payment</th>
                            <th className="p-2.5">Status</th>
                            <th className="p-2.5">Total</th>
                            <th className="p-2.5 text-right">Receipt</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y">
                          {onlineOrders.map(order => (
                            <tr key={order.orderId} className="hover:bg-slate-50">
                              <td className="p-2.5 font-mono font-bold text-slate-900">{order.orderId}</td>
                              <td className="p-2.5 text-[11px] text-slate-500">{order.timestamp}</td>
                              <td className="p-2.5">
                                <p className="font-bold text-slate-800">{order.customerName}</p>
                                <p className="text-[10px] text-slate-500">{order.phone}</p>
                              </td>
                              <td className="p-2.5 max-w-[180px] truncate text-slate-600" title={order.address}>{order.address}</td>
                              <td className="p-2.5 font-bold">{order.paymentMode}</td>
                              <td className="p-2.5">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${order.status === 'DELIVERED' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                  {order.status}
                                </span>
                              </td>
                              <td className="p-2.5 font-black text-amber-600">₹{(order.grandTotal || order.totalAmount).toFixed(2)}</td>
                              <td className="p-2.5 text-right">
                                <button 
                                  onClick={() => setReceiptModal({ isOpen: true, data: order })} 
                                  className="px-2.5 py-1 bg-amber-400 hover:bg-amber-500 font-bold text-slate-900 rounded"
                                >
                                  Print
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>

                  {/* In-Store POS Section */}
                  <div className="bg-white p-4 rounded-xl border overflow-x-auto space-y-3">
                    <div className="flex justify-between items-center border-b pb-2">
                      <h2 className="font-black text-base text-slate-900">In-Store POS Audit</h2>
                      <span className="text-xs font-bold text-slate-600">{transactions.length} Transactions</span>
                    </div>
                    {transactions.length === 0 ? (
                      <p className="text-xs text-slate-500 py-2">No in-store transactions processed yet.</p>
                    ) : (
                      <table className="w-full text-left text-xs min-w-[600px]">
                        <thead className="bg-slate-50 border-b font-bold text-slate-700">
                          <tr>
                            <th className="p-2.5">Invoice #</th>
                            <th className="p-2.5">Time</th>
                            <th className="p-2.5">Customer Name / Phone</th>
                            <th className="p-2.5">Cashier</th>
                            <th className="p-2.5">Payment</th>
                            <th className="p-2.5">Total</th>
                            <th className="p-2.5 text-right">Receipt</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y">
                          {transactions.map(tx => (
                            <tr key={tx.invoiceNumber} className="hover:bg-slate-50">
                              <td className="p-2.5 font-mono font-bold text-slate-900">{tx.invoiceNumber}</td>
                              <td className="p-2.5 text-[11px] text-slate-500">{tx.timestamp}</td>
                              <td className="p-2.5">
                                <p className="font-bold text-slate-800">{tx.customerName}</p>
                                <p className="text-[10px] text-slate-500">{tx.customerPhone}</p>
                              </td>
                              <td className="p-2.5 text-slate-600">{tx.cashier}</td>
                              <td className="p-2.5 font-bold">{tx.paymentMode}</td>
                              <td className="p-2.5 font-black text-amber-600">₹{tx.grandTotal.toFixed(2)}</td>
                              <td className="p-2.5 text-right">
                                <button onClick={() => setReceiptModal({ isOpen: true, data: tx })} className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 font-bold rounded">Print</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                </main>
              )}

              {isSkuModalOpen && (
                <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-3 sm:p-4 no-print overflow-y-auto">
                  <div className="bg-white rounded-2xl max-w-md w-full p-4 sm:p-6 space-y-4 shadow-2xl my-auto">
                    <div className="flex justify-between items-center border-b pb-3">
                      <h3 className="font-black text-base text-slate-900">
                        {editingSku ? 'Edit Stock & Details' : 'Add New Inventory SKU'}
                      </h3>
                      <button onClick={() => setIsSkuModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">X</button>
                    </div>

                    <form onSubmit={handleSaveSku} className="space-y-3 text-xs">
                      <div>
                        <label className="block font-bold text-slate-600 mb-1">PRODUCT NAME *</label>
                        <input type="text" required placeholder="e.g. Organic Brown Eggs 6 Pack" value={skuForm.name} onChange={e => setSkuForm({...skuForm, name: e.target.value})} className="w-full p-2.5 border rounded-lg" />
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block font-bold text-slate-600 mb-1">CATEGORY *</label>
                          <select value={skuForm.category} onChange={e => setSkuForm({...skuForm, category: e.target.value})} className="w-full p-2.5 border rounded-lg bg-white">
                            <option value="Dairy & Bakery">Dairy & Bakery</option>
                            <option value="Fruits & Vegetables">Fruits & Vegetables</option>
                            <option value="Snacks & Drinks">Snacks & Drinks</option>
                            <option value="Atta, Rice & Staples">Atta, Rice & Staples</option>
                            <option value="Household">Household</option>
                            <option value="Personal Care">Personal Care</option>
                          </select>
                        </div>
                        <div>
                          <label className="block font-bold text-slate-600 mb-1">UNIT / WEIGHT</label>
                          <input type="text" placeholder="e.g. 500 g or 1 L" value={skuForm.unit} onChange={e => setSkuForm({...skuForm, unit: e.target.value})} className="w-full p-2.5 border rounded-lg" />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block font-bold text-slate-600 mb-1">STOCK QTY *</label>
                          <input type="number" min="0" required placeholder="0" value={skuForm.stock} onChange={e => setSkuForm({...skuForm, stock: e.target.value})} className="w-full p-2.5 border rounded-lg" />
                        </div>
                        <div>
                          <label className="block font-bold text-slate-600 mb-1">SELLING PRICE (₹) *</label>
                          <input type="number" step="0.01" min="0" required placeholder="0.00" value={skuForm.price} onChange={e => setSkuForm({...skuForm, price: e.target.value})} className="w-full p-2.5 border rounded-lg" />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block font-bold text-slate-600 mb-1">MRP PRICE (₹)</label>
                          <input type="number" step="0.01" min="0" placeholder="0.00" value={skuForm.mrp} onChange={e => setSkuForm({...skuForm, mrp: e.target.value})} className="w-full p-2.5 border rounded-lg" />
                        </div>
                        <div>
                          <label className="block font-bold text-slate-600 mb-1">AISLE / RACK</label>
                          <input type="text" placeholder="e.g. Aisle 3-Shelf C" value={skuForm.aisle} onChange={e => setSkuForm({...skuForm, aisle: e.target.value})} className="w-full p-2.5 border rounded-lg" />
                        </div>
                      </div>

                      <div>
                        <label className="block font-bold text-slate-600 mb-1">BARCODE CODE</label>
                        <input type="text" placeholder="8901000..." value={skuForm.barcode} onChange={e => setSkuForm({...skuForm, barcode: e.target.value})} className="w-full p-2.5 border rounded-lg font-mono" />
                      </div>

                      <div className="flex justify-end space-x-2 pt-3 border-t">
                        <button type="button" onClick={() => setIsSkuModalOpen(false)} className="px-4 py-2 border rounded-lg font-bold">Cancel</button>
                        <button type="submit" className="px-4 py-2 bg-slate-900 text-amber-400 font-black rounded-lg">Save Product</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {receiptModal.isOpen && receiptModal.data && (
                <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-3 sm:p-4">
                  <div className="bg-white rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl">
                    <div className="bg-slate-900 text-white p-3 flex justify-between items-center no-print">
                      <span className="font-bold text-xs">{receiptModal.data.type === 'ONLINE' ? 'Online Order Invoice' : 'POS Invoice'}</span>
                      <button onClick={() => window.print()} className="px-3 py-1 bg-amber-400 text-slate-900 font-bold text-xs rounded">Print</button>
                      <button onClick={() => setReceiptModal({ isOpen: false, data: null })} className="text-white font-bold">X</button>
                    </div>
                    <div id="printable-receipt-area" className="p-6 text-xs space-y-3">
                      <div className="text-center border-b pb-3">
                        <h2 className="text-2xl font-black italic">zippy</h2>
                        <p className="text-[10px] text-slate-500">SUPERMARKET & ONLINE RETAIL</p>
                      </div>
                      <div className="text-[10px] space-y-0.5">
                        <p>Ref #: <strong>{receiptModal.data.invoiceNumber || receiptModal.data.orderId}</strong></p>
                        <p>Customer: <strong>{receiptModal.data.customerName}</strong> ({receiptModal.data.phone || receiptModal.data.customerPhone})</p>
                        {receiptModal.data.address && <p>Delivery Address: <strong>{receiptModal.data.address}</strong></p>}
                        <p>Payment Mode: <strong>{receiptModal.data.paymentMode}</strong></p>
                        {receiptModal.data.status && <p>Status: <strong>{receiptModal.data.status}</strong></p>}
                        {receiptModal.data.cashier && <p>Cashier: <strong>{receiptModal.data.cashier}</strong></p>}
                      </div>
                      <table className="w-full text-left border-t border-b py-2 text-[11px]">
                        <thead><tr className="border-b font-bold"><th className="py-1">Item</th><th className="py-1 text-center">Qty</th><th className="py-1 text-right">Amt</th></tr></thead>
                        <tbody>
                          {receiptModal.data.items.map((it, idx) => (
                            <tr key={idx}><td className="py-1">{it.name}</td><td className="py-1 text-center">{it.qty}</td><td className="py-1 text-right">₹{(it.price * it.qty).toFixed(2)}</td></tr>
                          ))}
                        </tbody>
                      </table>
                      <div className="text-right text-xs space-y-1 pt-1 font-bold">
                        {receiptModal.data.subtotal && <p className="text-slate-600">Subtotal: ₹{receiptModal.data.subtotal.toFixed(2)}</p>}
                        {receiptModal.data.deliveryFee && <p className="text-slate-600">Delivery Fee: ₹{receiptModal.data.deliveryFee.toFixed(2)}</p>}
                        {receiptModal.data.gstTotal && <p className="text-slate-600">GST (5%): ₹{receiptModal.data.gstTotal.toFixed(2)}</p>}
                        <p className="text-sm font-black text-slate-900 border-t pt-1">
                          Grand Total: ₹{(receiptModal.data.grandTotal || receiptModal.data.totalAmount).toFixed(2)}
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ZippyApp />);
    </script>
</body>
</html>
